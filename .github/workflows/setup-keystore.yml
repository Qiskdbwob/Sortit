name: Setup Keystore
# Satu kali: buat keystore release di runner, unggah artifact + password.
# Setelah itu set GitHub Secrets dari artifact, lalu CD pakai signing tetap.
on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate release keystore
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        id: gen
        run: |
          set -euo pipefail
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          ALIAS="sortit"
          keytool -genkeypair -v \
            -keystore sortit-release.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Sortit, OU=Mobile, O=Sortit, L=ID, ST=ID, C=ID"
          base64 -w0 sortit-release.jks > keystore.base64.txt
          {
            echo "KEY_ALIAS=$ALIAS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
          } > keystore-credentials.txt
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          # mask password in logs
          echo "::add-mask::$PASS"

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: sortit-release-keystore
          path: |
            sortit-release.jks
            keystore.base64.txt
            keystore-credentials.txt
          retention-days: 7

      - name: Next steps
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## Keystore dibuat

          1. Download artifact **sortit-release-keystore**
          2. Set GitHub Secrets (repo → Settings → Secrets, atau `gh secret set`):
             - `KEYSTORE_BASE64` ← isi file `keystore.base64.txt`
             - `KEYSTORE_PASSWORD` ← dari `keystore-credentials.txt`
             - `KEY_ALIAS` ← `sortit`
             - `KEY_PASSWORD` ← sama dengan KEYSTORE_PASSWORD
          3. Simpan `sortit-release.jks` di tempat aman (backup offline)
          4. Jalankan workflow **CD** (manual) untuk APK signed

          **Penting:** APK lama yang di-sign debug beda signature → install pertama release perlu uninstall sekali. Setelah itu update pakai keystore yang sama = tanpa uninstall.
          MD
