name: CD
# CD: build release APK. HANYA jalan jika CI (workflow "CI") sukses.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master, dev, sortit-v2]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK
    # gate: CI harus sukses
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Decode keystore (jika ada secret)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "No keystore secret; using debug signing for artifact."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sortit-release-apk
          path: app/build/outputs/apk/release/*.apk
